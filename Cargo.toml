[package]
name = "betamacs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
image = "0.25.10"
ndarray = "0.17.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSColor", "NSView", "NSResponder", "NSGraphics"] }
ort = { version = "2.0.0-rc.13", features = ["coreml"] }
softbuffer = "0.4.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winit = "0.30.13"
xcap = "0.9.8"
