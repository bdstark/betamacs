<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>betamacs settings</title>
    <script type="module" src="/src/main.ts"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --panel: #ffffff;
        --text: #1c1c1e;
        --muted: #6e6e73;
        --accent: #0a84ff;
        --border: #d2d2d7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --panel: #2c2c2e;
          --text: #f5f5f7;
          --muted: #98989d;
          --accent: #0a84ff;
          --border: #3a3a3c;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <bm-app></bm-app>
  </body>
</html>
