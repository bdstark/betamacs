<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>betamacs settings</title>
    <!-- Apply a remembered theme before the stylesheet arrives so a light
         choice does not flash dark on load. Mirrors ui-kit's theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem("nh-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <bm-app></bm-app>
  </body>
</html>
